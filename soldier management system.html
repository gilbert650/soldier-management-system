<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soldier Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef1f5;
}

/* HEADER */
header{
    background:#1b4332;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    font-size:36px;
}

/* NAVIGATION */
nav{
    background:#2d6a4f;
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    flex-wrap:wrap;
}

nav button{
    background:#ffb703;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */
.container{
    padding:20px;
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.card h2{
    color:#1b4332;
}

.number{
    font-size:40px;
    color:#ff8800;
    margin-top:10px;
}

/* FORM */
.form-section{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.form-section h2{
    margin-bottom:15px;
    color:#1b4332;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

.submit-btn{
    background:#1b4332;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

table th{
    background:#1b4332;
    color:white;
    padding:12px;
}

table td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.status-btn{
    background:#2196f3;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#1b4332;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
</style>
</head>
<body>

<header>
    <h1>🪖 Soldier Management System</h1>
    <p>Personnel & Duty Monitoring</p>
</header>

<nav>
    <button onclick="showSoldiers()">Soldiers</button>
    <button onclick="showDuties()">Duties</button>
    <button onclick="showReports()">Reports</button>
    <button onclick="showAttendance()">Attendance</button>
</nav>

<div class="container">

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="card">
            <h2>Total Soldiers</h2>
            <div class="number" id="totalSoldiers">0</div>
        </div>

        <div class="card">
            <h2>On Duty</h2>
            <div class="number" id="onDuty">0</div>
        </div>

        <div class="card">
            <h2>Off Duty</h2>
            <div class="number" id="offDuty">0</div>
        </div>

        <div class="card">
            <h2>Completed Missions</h2>
            <div class="number" id="missions">0</div>
        </div>

    </div>

    <!-- FORM -->
    <div class="form-section">

        <h2>Register Soldier</h2>

        <input type="text" id="soldierName" placeholder="Soldier Name">

        <input type="text" id="soldierRank" placeholder="Rank">

        <select id="soldierUnit">
            <option>Infantry</option>
            <option>Air Force</option>
            <option>Navy</option>
            <option>Engineering</option>
            <option>Medical</option>
        </select>

        <input type="text" id="soldierLocation" placeholder="Station">

        <button class="submit-btn" onclick="addSoldier()">
            Add Soldier
        </button>

    </div>

    <!-- TABLE -->
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Rank</th>
                <th>Unit</th>
                <th>Station</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="soldierTable"></tbody>

    </table>

</div>

<footer>
    Soldier Management System Using HTML, CSS, JavaScript, Node.js & SQL
</footer>

<script>

/*
=====================================================
MYSQL DATABASE
=====================================================

CREATE DATABASE soldier_management;

USE soldier_management;

CREATE TABLE soldiers(
    id INT AUTO_INCREMENT PRIMARY KEY,
    soldier_name VARCHAR(100),
    soldier_rank VARCHAR(100),
    soldier_unit VARCHAR(100),
    soldier_station VARCHAR(100),
    status VARCHAR(50)
);

=====================================================
NODE.JS SERVER
=====================================================

const express = require("express");
const mysql = require("mysql2");

const app = express();

app.use(express.json());

const db = mysql.createConnection({
    host:"localhost",
    user:"root",
    password:"",
    database:"soldier_management"
});

db.connect();

app.post("/add-soldier",(req,res)=>{

    const data = req.body;

    db.query(
        "INSERT INTO soldiers(soldier_name,soldier_rank,soldier_unit,soldier_station,status) VALUES(?,?,?,?,?)",
        [
            data.name,
            data.rank,
            data.unit,
            data.station,
            "ON DUTY"
        ],
        (err,result)=>{
            if(err) throw err;

            res.send("Soldier added successfully");
        }
    );
});

app.listen(3000);

=====================================================
*/

// FRONTEND SYSTEM

let soldiers = [];

let completedMissions = 0;

const soldierTable =
document.getElementById("soldierTable");

// UPDATE DASHBOARD
function updateDashboard(){

    document.getElementById("totalSoldiers")
    .innerText = soldiers.length;

    const onDuty =
    soldiers.filter(s =>
        s.status === "ON DUTY"
    ).length;

    const offDuty =
    soldiers.filter(s =>
        s.status === "OFF DUTY"
    ).length;

    document.getElementById("onDuty")
    .innerText = onDuty;

    document.getElementById("offDuty")
    .innerText = offDuty;

    document.getElementById("missions")
    .innerText = completedMissions;
}

// ADD SOLDIER
function addSoldier(){

    const name =
    document.getElementById("soldierName").value;

    const rank =
    document.getElementById("soldierRank").value;

    const unit =
    document.getElementById("soldierUnit").value;

    const station =
    document.getElementById("soldierLocation").value;

    if(!name || !rank || !station){

        alert("Please fill all fields");
        return;
    }

    const soldier = {
        id: Date.now(),
        name,
        rank,
        unit,
        station,
        status:"ON DUTY"
    };

    soldiers.push(soldier);

    renderSoldiers();

    updateDashboard();

    clearForm();

    alert("Soldier registered successfully!");
}

// DISPLAY SOLDIERS
function renderSoldiers(){

    soldierTable.innerHTML = "";

    soldiers.forEach((soldier,index)=>{

        soldierTable.innerHTML += `
        <tr>

            <td>${soldier.id}</td>

            <td>${soldier.name}</td>

            <td>${soldier.rank}</td>

            <td>${soldier.unit}</td>

            <td>${soldier.station}</td>

            <td>${soldier.status}</td>

            <td>

                <button class="status-btn"
                onclick="toggleStatus(${index})">

                    ${soldier.status === "ON DUTY"
                        ? "Set OFF"
                        : "Set ON"}

                </button>

                <button class="delete-btn"
                onclick="deleteSoldier(${index})">
                    Delete
                </button>

            </td>

        </tr>
        `;
    });
}

// CHANGE STATUS
function toggleStatus(index){

    if(soldiers[index].status === "ON DUTY"){

        soldiers[index].status = "OFF DUTY";

    }else{

        soldiers[index].status = "ON DUTY";

        completedMissions++;
    }

    renderSoldiers();

    updateDashboard();
}

// DELETE SOLDIER
function deleteSoldier(index){

    soldiers.splice(index,1);

    renderSoldiers();

    updateDashboard();
}

// CLEAR FORM
function clearForm(){

    document.getElementById("soldierName").value = "";

    document.getElementById("soldierRank").value = "";

    document.getElementById("soldierLocation").value = "";
}

// NAVIGATION DEMO
function showSoldiers(){
    alert("Viewing Soldiers");
}

function showDuties(){
    alert("Viewing Duties");
}

function showReports(){
    alert("Viewing Reports");
}

function showAttendance(){
    alert("Viewing Attendance");
}

// INITIAL LOAD
updateDashboard();

</script>

</body>
</html>
